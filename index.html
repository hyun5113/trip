function memoEndpoint(city){return SUPABASE_URL+"/rest/v1/travel_memos?select=id,city,author,content,created_at&city=eq."+encodeURIComponent(city)+"&order=created_at.desc"}
function memoRowEndpoint(id){return SUPABASE_URL+"/rest/v1/travel_memos?id=eq."+encodeURIComponent(id)}
function commentEndpoint(memoId){return SUPABASE_URL+"/rest/v1/travel_memo_comments?select=id,memo_id,author,content,created_at&memo_id=eq."+encodeURIComponent(memoId)+"&order=created_at.asc"}
function memoHeaders(extra={}){return Object.assign({apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY},extra)}
function showMemoError(error){document.getElementById("memoStatus").textContent=error||"요청을 완료하지 못했어요. 데이터베이스 권한을 확인해 주세요."}
async function renderMemos(){const list=document.getElementById("memoList"),status=document.getElementById("memoStatus"),city=memoCity(),token=++memoLoadToken;if(!list||!city)return;list.textContent="";status.textContent="메모를 불러오는 중…";try{const response=await fetch(memoEndpoint(city),{headers:memoHeaders()});if(!response.ok)throw new Error("HTTP "+response.status);const items=await response.json();if(token!==memoLoadToken||city!==memoCity())return;status.textContent="";if(!items.length){const empty=document.createElement("div");empty.className="memo-list-empty";empty.textContent="아직 등록된 메모가 없습니다.";list.append(empty);return}for(const item of items){const card=document.createElement("article"),head=document.createElement("div"),who=document.createElement("span"),body=document.createElement("p"),actions=document.createElement("div"),edit=document.createElement("button"),remove=document.createElement("button"),editor=document.createElement("div"),editField=document.createElement("textarea"),editStatus=document.createElement("div"),saveEdit=document.createElement("button"),cancelEdit=document.createElement("button"),comments=document.createElement("section");card.className="memo-item";head.className="memo-item-head";who.textContent=(item.author||"익명")+" · "+new Date(item.created_at).toLocaleString("ko-KR");body.className="memo-item-text";body.textContent=item.content;actions.className="memo-actions";edit.type=remove.type=saveEdit.type=cancelEdit.type="button";edit.className=remove.className=saveEdit.className=cancelEdit.className="memo-action";remove.classList.add("danger");edit.textContent="수정";remove.textContent="삭제";edit.addEventListener("click",()=>{editor.style.display="block";editField.value=item.content;editField.focus()});remove.addEventListener("click",()=>deleteMemo(item.id));actions.append(edit,remove);editor.className="memo-edit-box";editField.maxLength=2000;editField.value=item.content;saveEdit.textContent="수정 저장";cancelEdit.textContent="취소";editStatus.className="memo-action-status";saveEdit.addEventListener("click",()=>saveMemoEdit(item.id,editField,editStatus,saveEdit,editor));cancelEdit.addEventListener("click",()=>{editor.style.display="none";editStatus.textContent=""});editor.append(editField,saveEdit,cancelEdit,editStatus);comments.className="memo-comments";comments.textContent="댓글을 불러오는 중…";card.append(head,body,actions,editor,comments);list.append(card);renderComments(item.id,comments)}}catch(error){if(token===memoLoadToken){console.error("메모 불러오기 실패",error);list.textContent="";showMemoError("메모를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.")}}}
async function saveMemo(){if(selected<0)return;const field=document.getElementById("memoText"),text=field.value.trim(),status=document.getElementById("memoStatus"),button=document.querySelector(".memo-save");if(!text){status.textContent="메모 내용을 입력해 주세요.";return}button.disabled=true;status.textContent="저장하는 중…";try{const response=await fetch(SUPABASE_URL+"/rest/v1/travel_memos",{method:"POST",headers:memoHeaders({"Content-Type":"application/json",Prefer:"return=minimal"}),body:JSON.stringify({city:memoCity(),author:document.getElementById("memoAuthor").value.trim()||"익명",content:text})});if(!response.ok)throw new Error("HTTP "+response.status);field.value="";status.textContent="모두와 공유되도록 저장했어요.";await renderMemos()}catch(error){console.error("메모 저장 실패",error);showMemoError("저장하지 못했어요. 연결 또는 데이터베이스 권한을 확인해 주세요.")}finally{button.disabled=false}}
async function saveMemoEdit(id,field,status,button,editor){const content=field.value.trim();if(!content){status.textContent="내용을 입력해 주세요.";return}button.disabled=true;status.textContent="수정하는 중…";try{const response=await fetch(memoRowEndpoint(id),{method:"PATCH",headers:memoHeaders({"Content-Type":"application/json",Prefer:"return=minimal"}),body:JSON.stringify({content})});if(!response.ok)throw new Error("HTTP "+response.status);status.textContent="수정했어요.";editor.style.display="none";await renderMemos()}catch(error){console.error("메모 수정 실패",error);status.textContent="수정하지 못했어요. 데이터베이스 수정 권한을 확인해 주세요."}finally{button.disabled=false}}
async function deleteMemo(id){if(!confirm("이 메모와 댓글을 삭제할까요?"))return;try{const response=await fetch(memoRowEndpoint(id),{method:"DELETE",headers:memoHeaders({Prefer:"return=minimal"})});if(!response.ok)throw new Error("HTTP "+response.status);document.getElementById("memoStatus").textContent="메모를 삭제했어요.";await renderMemos()}catch(error){console.error("메모 삭제 실패",error);showMemoError("삭제하지 못했어요. 데이터베이스 삭제 권한을 확인해 주세요.")}}
async function renderComments(memoId,container){container.textContent="";const title=document.createElement("h3"),items=document.createElement("div"),form=document.createElement("div"),author=document.createElement("input"),content=document.createElement("textarea"),submit=document.createElement("button"),status=document.createElement("div");title.className="memo-comments-title";title.textContent="댓글";items.className="memo-comment-list";form.className="memo-comment-form";author.maxLength=40;author.placeholder="작성자 이름";author.value=document.getElementById("memoAuthor").value.trim();content.maxLength=500;content.placeholder="댓글을 남겨보세요.";submit.type="button";submit.className="memo-action";submit.textContent="댓글 등록";status.className="memo-comment-status";submit.addEventListener("click",()=>addMemoComment(memoId,author,content,status,submit,items));form.append(author,content,submit,status);container.append(title,items,form);try{const response=await fetch(commentEndpoint(memoId),{headers:memoHeaders()});if(!response.ok)throw new Error("HTTP "+response.status);const comments=await response.json();items.textContent="";if(!comments.length){const empty=document.createElement("div");empty.className="memo-list-empty";empty.textContent="댓글이 아직 없습니다.";items.append(empty);return}for(const comment of comments){const row=document.createElement("div"),meta=document.createElement("div"),text=document.createElement("p");row.className="memo-comment";meta.className="memo-item-head";meta.textContent=(comment.author||"익명")+" · "+new Date(comment.created_at).toLocaleString("ko-KR");text.className="memo-item-text";text.textContent=comment.content;row.append(meta,text);items.append(row)}}catch(error){console.error("댓글 불러오기 실패",error);items.textContent="댓글을 불러오지 못했어요. 댓글 테이블과 조회 권한을 확인해 주세요."}}
async function addMemoComment(memoId,author,content,status,button,list){const value=content.value.trim();if(!value){status.textContent="댓글 내용을 입력해 주세요.";return}button.disabled=true;status.textContent="등록하는 중…";try{const response=await fetch(SUPABASE_URL+"/rest/v1/travel_memo_comments",{method:"POST",headers:memoHeaders({"Content-Type":"application/json",Prefer:"return=minimal"}),body:JSON.stringify({memo_id:memoId,author:author.value.trim()||"익명",content:value})});if(!response.ok)throw new Error("HTTP "+response.status);content.value="";status.textContent="댓글을 등록했어요.";await renderComments(memoId,list.parentElement)}catch(error){console.error("댓글 등록 실패",error);status.textContent="댓글을 등록하지 못했어요. 댓글 테이블과 추가 권한을 확인해 주세요."}finally{button.disabled=false}}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('err');if(selected<0||!cities[selected]){err.textContent='먼저 여행 도시를 선택해 주세요.';return}if(!window.crypto||!crypto.subtle){err.textContent='이 브라우저에서는 비밀번호 확인 기능을 사용할 수 없어요. HTTPS로 열린 GitHub Pages 주소에서 다시 시도해 주세요.';return}const button=document.getElementById('unlock');button.disabled=true;button.textContent='확인 중…';err.textContent='';try{const plain=await decrypt(cities[selected],document.getElementById('pw').value);let html=dec.decode(plain);html=html.replace(/<\/head\s*>/i,'<style>.city-switcher{display:none!important}</style></head>');const f=document.getElementById('page');f.srcdoc=html;f.style.display='block';document.getElementById('cityContent').style.display='block';showCityPanel('plan');renderMemos();document.getElementById('gate').style.display='none';document.getElementById('navPicker').style.display='flex'}catch(error){console.error('여행지 열기 실패',error);err.textContent=error&&error.name==='OperationError'?'비밀번호가 맞지 않아요. 다시 확인해 주세요.':'페이지를 열지 못했어요. HTTPS 연결과 브라우저를 확인해 주세요.'}finally{button.disabled=false;button.textContent='열기'}});</script></body></html>
